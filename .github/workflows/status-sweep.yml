name: status sweep

# Vercel's Hobby plan allows one cron a day, which is not a health check. This
# workflow is the real heartbeat: it calls the same endpoint Vercel Cron would,
# on a schedule GitHub does not charge a public repository for.
#
# Two secrets are needed on the repository (Settings → Secrets and variables →
# Actions):
#   STATUS_URL   e.g. https://atrium-status.vercel.app   (no trailing slash)
#   CRON_SECRET  the same value set in the Vercel project
#
# Delete this workflow if the project moves to a Vercel plan with real crons —
# vercel.json already carries the schedule.

on:
  schedule:
    # Every 10 minutes. GitHub queues scheduled runs and can be several minutes
    # late under load; for a status board that is fine.
    - cron: "*/10 * * * *"
  workflow_dispatch:

# A late run must never pile up on a still-running one.
concurrency:
  group: status-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run every monitor
        env:
          STATUS_URL: ${{ secrets.STATUS_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$STATUS_URL" ]; then
            echo "STATUS_URL secret is not set — nothing to sweep."
            exit 1
          fi

          response=$(mktemp)
          code=$(curl -sS -o "$response" -w '%{http_code}' \
            --max-time 120 \
            -X POST "${STATUS_URL%/}/api/cron/check" \
            -H "Authorization: Bearer ${CRON_SECRET}")

          echo "HTTP $code"
          cat "$response"
          echo

          # A non-2xx here means the sweep did not run: the board is going stale
          # and that should be visible as a failed workflow, not swallowed.
          case "$code" in
            2*) exit 0 ;;
            *) exit 1 ;;
          esac
